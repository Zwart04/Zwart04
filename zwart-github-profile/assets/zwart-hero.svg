<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ZWART - building useful things. A minimal animated profile banner.">
  <title>ZWART — building useful things</title>
  <desc>A minimalist charcoal and blue animated header for Zwart's GitHub profile.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#30445D" opacity="0.33"/></pattern>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#518BD8"/><stop offset="1" stop-color="#233449"/></linearGradient>
  </defs>
  <style>
    .reveal { animation: appear 1s ease-out both; }
    .delay { animation-delay: .22s; }
    .long-delay { animation-delay: .44s; }
    .orbit { transform-origin: 972px 160px; animation: spin 24s linear infinite; }
    .pulse { animation: breathe 2.7s ease-in-out infinite; }
    .dash { animation: drift 14s linear infinite; }
    .blip { animation: blink 3s ease-in-out infinite; }
    @keyframes appear { from {opacity:0; transform:translateY(9px)} to {opacity:1; transform:translateY(0)} }
    @keyframes spin {to {transform:rotate(360deg)} }
    @keyframes breathe { 0%,100% {opacity:.45} 50% {opacity:1} }
    @keyframes drift { to {stroke-dashoffset:-180} }
    @keyframes blink { 0%,100% {opacity:1} 50% {opacity:.25} }
    @media (prefers-reduced-motion: reduce) { * {animation:none !important} }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0D1420"/>
    <rect width="1200" height="320" fill="url(#dots)" opacity=".5"/>
    <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#273649" stroke-width="2"/>
    <path d="M0 7 H1200" stroke="url(#edge)" stroke-width="3" opacity=".95"/>
    <g class="reveal">
      <rect x="68" y="60" width="35" height="35" rx="8" fill="#1E3E65" stroke="#5082BF" stroke-opacity=".55" />
      <path d="M79 70 H93 L79 85 H94" stroke="#C8E5FF" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round" fill="none" />
      <text x="120" y="82" fill="#9FB2CB" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="3">INDEPENDENT MAKER</text>
    </g>
    <g class="reveal delay">
      <text x="66" y="187" fill="#F5F8FF" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="95" letter-spacing="-4">ZWART</text>
      <rect x="67" y="199" width="66" height="3" rx="1.5" fill="#6DB5F9"/>
      <text x="66" y="239" fill="#AABAD1" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="23" letter-spacing=".4">Ideas to products. Built with purpose.</text>
    </g>
    <g class="reveal long-delay">
      <circle cx="76" cy="278" r="4" fill="#71D0B4" class="blip"/>
      <text x="90" y="283" fill="#7088A6" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.4">AI TOOLS  /  APPS  /  AUTOMATION  /  OPEN SOURCE</text>
    </g>
    <path d="M711 0 L829 320" stroke="#203044" stroke-width="1" />
    <path d="M744 0 L862 320" stroke="#203044" stroke-width="1" />
    <circle cx="972" cy="160" r="139" fill="none" stroke="#2A3E56" stroke-width="1" />
    <circle cx="972" cy="160" r="106" fill="none" stroke="#36506C" stroke-width="1" stroke-dasharray="4 9" class="dash" />
    <circle cx="972" cy="160" r="72" fill="#101C2D" stroke="#415E7E" stroke-width="1.5" />
    <circle cx="972" cy="160" r="45" fill="none" stroke="#254466" stroke-width="1" />
    <g class="orbit"><circle cx="972" cy="54" r="5" fill="#84C4FC" /><circle cx="972" cy="54" r="11" fill="#84C4FC" opacity=".11"/></g>
    <g class="pulse"><path d="M951 136 H1000 L947 183 H999" fill="none" stroke="#86C4FA" stroke-width="10" stroke-linejoin="round" stroke-linecap="square" /></g>
    <path d="M784 160 H869 M1075 160 H1145 M972 22 V50 M972 270 V299" stroke="#466080" stroke-width="1" stroke-dasharray="3 7" />
    <circle cx="1146" cy="160" r="2.5" fill="#6AA5E0" />
    <text x="1132" y="43" fill="#526B89" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="end">EST. / 2026</text>
    <text x="1132" y="295" fill="#526B89" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="end">BUILD / SHIP / REPEAT</text>
  </g>
</svg>
