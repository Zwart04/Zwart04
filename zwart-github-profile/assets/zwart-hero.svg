<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ZWART - building useful things">
  <title>ZWART — Independent Maker</title>
  <defs>
    <!-- Background Gradient (Slate dark theme) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <style>
      /* Animasi sederhana dan mulus (tidak lebay) */
      .fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
      .delay-1 { animation-delay: 0.15s; }
      .delay-2 { animation-delay: 0.3s; }
      
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" fill="url(#bg)" rx="16" />
  
  <!-- Subtle Border & Top Accent Line -->
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#1E293B" stroke-width="2" rx="15" />
  <path d="M0 16 Q 0 0 16 0 L 800 0" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.8" />

  <!-- Minimalist Right Side Graphic (Subtle Diagonal Slashes) -->
  <g class="fade-up delay-2" stroke="#1E293B" stroke-width="2" stroke-linecap="round">
    <line x1="850" y1="-50" x2="1100" y2="400" opacity="0.6" />
    <line x1="920" y1="-50" x2="1170" y2="400" opacity="0.3" />
    <line x1="990" y1="-50" x2="1240" y2="400" opacity="0.1" />
  </g>

  <!-- Main Content Group -->
  <g transform="translate(100, 110)">
    
    <!-- Top Tagline -->
    <text x="0" y="0" class="fade-up" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="2.5">
      INDEPENDENT MAKER
    </text>

    <!-- Main Title -->
    <text x="-4" y="70" class="fade-up delay-1" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" letter-spacing="-2">
      ZWART.
    </text>

    <!-- Subtitle -->
    <text x="0" y="115" class="fade-up delay-2" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
      Ideas to products. Built with purpose.
    </text>
  </g>

  <!-- Bottom Categories Tag -->
  <g transform="translate(100, 265)" class="fade-up delay-2">
    <circle cx="6" cy="-5" r="4.5" fill="#10B981" /> <!-- Green "Online/Active" Dot -->
    <text x="24" y="0" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="1">
      AI TOOLS · APPS · AUTOMATION · OPEN SOURCE
    </text>
  </g>
</svg>
