<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ZWART - building useful things">
  <title>ZWART — Independent Maker</title>
  <defs>
    <!-- Background Dark Theme -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Subtle Radial Glow di tengah -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Center Top Accent Line -->
    <linearGradient id="top-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>

    <style>
      .fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
      .delay-1 { animation-delay: 0.15s; }
      .delay-2 { animation-delay: 0.3s; }
      
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
    </style>
  </defs>

  <!-- Base Canvas & Borders -->
  <rect width="1200" height="320" fill="url(#bg)" rx="16" />
  <rect width="1200" height="320" fill="url(#glow)" rx="16" />
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#1E293B" stroke-width="2" rx="15" />
  
  <!-- Glowing Top Edge -->
  <rect x="300" y="0" width="600" height="2" fill="url(#top-accent)" opacity="0.9" />

  <!-- Center Aligned Content -->
  <g text-anchor="middle">
    
    <!-- Top Tagline -->
    <text x="600" y="100" class="fade-up" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="3">
      INDEPENDENT MAKER
    </text>

    <!-- Main Title -->
    <text x="600" y="175" class="fade-up delay-1" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" letter-spacing="-2">
      ZWART.
    </text>

    <!-- Subtitle -->
    <text x="600" y="225" class="fade-up delay-2" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
      Ideas to products. Built with purpose.
    </text>

  </g>

  <!-- Bottom Categories Badge / Pill -->
  <g transform="translate(600, 275)" class="fade-up delay-2">
    <!-- Pill Background -->
    <rect x="-215" y="-18" width="430" height="32" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Green Status Dot -->
    <circle cx="-190" cy="-2" r="4.5" fill="#10B981" />
    
    <!-- Category Text -->
    <text x="10" y="2" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500" letter-spacing="1" text-anchor="middle">
      AI TOOLS · APPS · AUTOMATION · OPEN SOURCE
    </text>
  </g>
</svg>
