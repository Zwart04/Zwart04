<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="bannerTitle bannerDesc">
<title id="bannerTitle">ZWART — Animated AI mascots</title>
<desc id="bannerDesc">An animated minimalist dark banner. Pixel Claude explores the Z, Codex types on the W, Grok swings from the A, Gemini floats above the R and T, and Cursor works on code near the T.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121417"/><stop offset="1" stop-color="#0e1013"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e9eaec"/></linearGradient>
  <clipPath id="clip"><rect width="1400" height="420" rx="22"/></clipPath>
</defs>
<style><![CDATA[
  svg { background: #101214; }
  .letter { fill: url(#ink); transform-box: fill-box; transform-origin: center; animation: letterBreathe 7s ease-in-out infinite; }
  .l1 { animation-delay: 0s; }
  .l2 { animation-delay: -.7s; }
  .l3 { animation-delay: -1.4s; }
  .l4 { animation-delay: -2.1s; }
  .l5 { animation-delay: -2.8s; }
  @keyframes letterBreathe { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-6px); } 55% { transform: translateY(-6px); } }
  .accent-pixel { animation: accent 4s steps(1,end) infinite; }
  @keyframes accent { 0%, 80%, 100% { opacity:1; } 82%, 88%{opacity:.3;} 85%, 91%{opacity:1;} }
  /* Claude explores the bottom left corner of the Z. */
  .clawd-trip { animation: clawdExplore 12s ease-in-out infinite; }
  @keyframes clawdExplore { 0%, 8%, 100%{transform:translate(0px,0px)} 23%{transform:translate(63px,0px)} 32%,47%{transform:translate(95px,-10px)} 59%{transform:translate(95px,-10px)} 76%{transform:translate(22px,0px)} 86%{transform:translate(0px,0px)} }
  .clawd-body { animation: clawdBob .38s steps(2,end) infinite; }
  @keyframes clawdBob { 0%,100% {transform:translateY(0)}50%{transform:translateY(-3px)} }
  .step-a { transform-origin: 27px 58px; animation: step .48s linear infinite; }
  .step-b { transform-origin: 53px 58px; animation: step .48s linear infinite reverse; }
  @keyframes step { 0%,100% {transform:rotate(-13deg)}50%{transform:rotate(16deg)} }
  .clawd-eyes { transform-box:fill-box; transform-origin:center; animation:clawdBlink 4.7s steps(1,end) infinite; }
  @keyframes clawdBlink{0%,92%,96%,100%{transform:scaleY(1)}93%,95%{transform:scaleY(.15)}}
  .wave-hand { transform-origin: 73px 31px; animation: wave 3.4s ease-in-out infinite; }
  @keyframes wave { 0%,59%,100%{transform:rotate(0deg)}68%,76%{transform:rotate(-29deg)}73%,83%{transform:rotate(13deg)} }
  .clawd-shadow { animation: shadowHop 12s ease-in-out infinite; }
  @keyframes shadowHop { 0%,100%{opacity:.65;transform:scaleX(1)}36%,53%{opacity:.27;transform:scaleX(.8)} }
  /* Codex sits on the W, tapping keys. */
  .codex-bob { animation: codexBob 3.2s ease-in-out infinite; }
  @keyframes codexBob { 0%,100%{transform:translateY(0px)}50%{transform:translateY(-4px)} }
  .codex-hand1 {transform-origin:50px 63px;animation:typing .42s steps(2,end) infinite;}
  .codex-hand2 {transform-origin:77px 64px;animation:typing .42s steps(2,end) infinite reverse;}
  @keyframes typing { 0%,100%{transform:translateY(0)}50%{transform:translateY(5px)} }
  .terminal-caret {animation:caret .85s steps(1,end) infinite;}
  @keyframes caret { 0%,49%{opacity:1}50%,100%{opacity:0} }
  .code-spark {animation:codeSpark 2.4s ease-in-out infinite;}
  .code-spark2 {animation:codeSpark 2.4s ease-in-out infinite -.9s;}
  @keyframes codeSpark{0%,100%{opacity:0;transform:translateY(6px)}40%,68%{opacity:1;transform:translateY(-5px)}}
  /* Grok is holding a cable and swinging over the A. */
  .grok-swing { transform-origin: 31px -62px; animation: grokSwing 5.5s ease-in-out infinite; }
  @keyframes grokSwing { 0%,100%{transform:rotate(-11deg)}50%{transform:rotate(13deg)} }
  .grok-kick {transform-origin:37px 72px;animation: kick 2.2s ease-in-out infinite;}
  @keyframes kick{0%,100%{transform:rotate(0)}50%{transform:rotate(24deg)}}
  /* Gemini orbits the lettering as a floating constellation. */
  .gemini-float { animation: geminiFloat 7s ease-in-out infinite; }
  @keyframes geminiFloat { 0%,100%{transform:translate(0,0) rotate(-5deg)}25%{transform:translate(-27px,-13px) rotate(6deg)}55%{transform:translate(-55px,4px) rotate(-5deg)}80%{transform:translate(-19px,12px) rotate(5deg)} }
  .twinkle {transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite;}
  .twinkle2{animation-delay:-1.1s}.twinkle3{animation-delay:-1.8s}
  @keyframes twinkle{0%,100%{transform:scale(.65);opacity:.35}50%{transform:scale(1.12);opacity:1}}
  .orbit-dots {animation:orbitDots 8s linear infinite;transform-origin:55px 49px;}
  @keyframes orbitDots {from{transform:rotate(0)}to{transform:rotate(360deg)}}
  /* Cursor tweaks a little code window at the foot of the T. */
  .cursor-bob {animation:cursorBob 4s ease-in-out infinite;}
  @keyframes cursorBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .cursor-arm{transform-origin:47px 29px;animation:cursorClick 2.4s ease-in-out infinite;}
  @keyframes cursorClick{0%,100%{transform:rotate(0)}38%{transform:rotate(-17deg)}45%{transform:rotate(4deg)}52%{transform:rotate(-17deg)}64%{transform:rotate(0)}}
  .pointer{animation:pointerMove 2.4s ease-in-out infinite;}
  @keyframes pointerMove{0%,100%{transform:translate(0,0)}38%{transform:translate(5px,-5px)}52%{transform:translate(5px,-5px)}70%{transform:translate(0,0)}}
  .click-pulse{animation:clickPulse 2.4s steps(1,end) infinite;}
  @keyframes clickPulse{0%,42%,58%,100%{opacity:0}43%,57%{opacity:1}}
  .code-line1{animation:lineIn 4s steps(1,end) infinite;}.code-line2{animation:lineIn 4s steps(1,end) infinite -1.2s;}
  @keyframes lineIn{0%,14%{opacity:0}15%,80%{opacity:1}81%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ *, *::before, *::after{animation:none!important} }
]]></style>
<g clip-path="url(#clip)">
<rect width="1400" height="420" fill="url(#bg)"/>
<!-- A minimal grounding glow behind the wordmark, deliberately subtle. -->
<ellipse cx="720" cy="345" rx="548" ry="21" fill="#2e3238" opacity=".13"/>

<!-- 1. ZWART: actual vector glyph outlines, no web font dependency. -->
<g id="zwart-wordmark">
<g transform="translate(226.00 294)"><g class="letter l1"><path transform="scale(0.1245117 -0.1245117)" d="M52 0H1265V306H500C554 366 607 427 658 487L1258 1216V1490H70V1184H818C765 1125 713 1065 662 1006L52 274Z"/></g></g>
<g transform="translate(385.98 294)"><g class="letter l2"><path transform="scale(0.1245117 -0.1245117)" d="M402 0H801L991 753C1007 816 1022 889 1040 976C1058 889 1073 816 1089 753L1280 0H1678L2076 1490H1688L1540 828C1512 697 1486 567 1462 436C1436 567 1408 697 1378 828L1219 1490H862L703 828C672 696 644 565 618 434C594 565 568 696 540 828L392 1490H5Z"/></g></g>
<g transform="translate(641.09 294)"><g class="letter l3"><path transform="scale(0.1245117 -0.1245117)" d="M5 0H396L487 287H1016L1104 0H1506L991 1490H517ZM577 568 604 655C656 821 704 984 755 1167C805 984 853 821 902 655L929 568Z"/></g></g>
<g transform="translate(825.23 294)"><g class="letter l4"><path transform="scale(0.1245117 -0.1245117)" d="M96 0H456V495H688L931 0H1311L1025 568C1181 649 1272 795 1272 986C1272 1295 1055 1490 710 1490H96ZM456 778V1195H685C830 1195 920 1113 920 986C920 860 830 778 686 778Z"/></g></g>
<g transform="translate(988.95 294)"><g class="letter l5"><path transform="scale(0.1245117 -0.1245117)" d="M42 1184H481V0H841V1184H1279V1490H42Z"/></g></g>
</g>
<!-- Tiny coral cursor/pixel at the end of the word, not a subtitle. -->
<rect class="accent-pixel" x="1174" y="258" width="17" height="17" rx="1.5" fill="#dd785b"/>

<!-- 2. CLAWD: walking in from the left, and climbing onto Z. -->
<g id="claude" transform="translate(79 271)">
  <g class="clawd-trip">
    <ellipse class="clawd-shadow" cx="39" cy="87" rx="36" ry="5" fill="#2c2e33"/>
    <g class="clawd-body">
      <g class="step-a"><path d="M23 55H34V70H22V62H18V57Z" fill="#d36a50"/></g>
      <g class="step-b"><path d="M46 54H59V68H48V63H43Z" fill="#df7859"/></g>
      <path d="M18 11H28V4H55V12H65V22H74V35H84V50H73V56H63V59H18V55H9V48H0V28H9V20H18Z" fill="#df7959"/>
      <path d="M28 5H55V11H28ZM19 12H28V20H19ZM8 29H17V48H8ZM65 22H74V35H65Z" fill="#ef916b" opacity=".55"/>
      <path class="clawd-eyes" d="M27 27H35V44H27ZM54 27H62V44H54Z" fill="#181818"/>
      <g class="wave-hand"><path d="M75 28H88V36H82V46H74Z" fill="#eb8868"/></g>
    </g>
  </g>
</g>

<!-- 3. CODEX: sitting on the W, coding on a laptop. -->
<g id="codex" transform="translate(475 35)">
 <g class="codex-bob">
   <path d="M20 30V19H31V11H64V18H74V30H84V71H74V80H64V89H52V78H40V89H28V79H18V69H8V32H20Z" fill="#466fc1" stroke="#7799f6" stroke-width="3" stroke-linejoin="round"/>
   <path d="M19 35H72V66H19Z" fill="#17233b" stroke="#9cbbff" stroke-width="2"/>
   <path d="M30 45L39 51L30 57" fill="none" stroke="#81e4dd" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
   <path class="terminal-caret" d="M46 58H56" stroke="#81e4dd" stroke-width="4"/>
   <path d="M4 54H14V70H8Z" fill="#6e92eb"/>
   <path d="M79 54H88V70H79Z" fill="#6e92eb"/>
   <path d="M30 83H41V90H30ZM57 83H68V90H57Z" fill="#6688db"/>
   <path d="M47 67H100L109 87H43Z" fill="#58667c" stroke="#8691a6" stroke-width="1.7" stroke-linejoin="round"/>
   <path d="M46 85H112V90H42Z" fill="#424b5e"/>
   <path d="M82 74H86V78H82Z" fill="#b7c5e2"/>
   <g class="codex-hand1"><path d="M49 65H59V70H65V75H50Z" fill="#87aaff"/></g>
   <g class="codex-hand2"><path d="M67 66H78V72H85V77H69Z" fill="#6592ff"/></g>
   <g fill="#80cfe9"><rect class="code-spark" x="111" y="31" width="6" height="6"/><rect class="code-spark2" x="125" y="43" width="4" height="4"/></g>
 </g>
</g>

<!-- 4. GROK: monochrome X-faced climber swinging from the top of A. -->
<g id="grok" transform="translate(789 64)">
 <g class="grok-swing">
   <path d="M31 -62V2" stroke="#a9adb4" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" opacity=".62"/>
   <path d="M24 -4H38V5H24Z" fill="#e5e7eb"/>
   <path d="M12 16H20V8H44V16H52V25H60V64H52V72H41V77H22V70H11V63H3V26H12Z" fill="#eceef0"/>
   <path d="M15 26H48V56H15Z" fill="#1a1e24"/>
   <path d="M23 34L39 48M39 34L23 48" stroke="#f1f3f5" stroke-width="4.2" stroke-linecap="square"/>
   <path d="M20 72V83H30V72ZM40 71V83H50V71Z" fill="#c4c7cc"/>
   <path d="M5 29H-4V10H4V2H12V18H9V41H5Z" fill="#e6e8eb"/>
   <g class="grok-kick"><path d="M42 71H52V91H60V98H45V88H41Z" fill="#dbdfe3"/></g>
 </g>
</g>

<!-- 5. GEMINI: a little dark pixel companion with the recognizable four-point star. -->
<g id="gemini" transform="translate(1042 36)">
 <g class="gemini-float">
   <g class="orbit-dots">
     <rect x="12" y="18" width="5" height="5" fill="#96adff"/>
     <rect x="99" y="70" width="5" height="5" fill="#bf9aff"/>
   </g>
   <path d="M34 34H42V26H69V34H78V43H87V76H77V86H68V91H39V85H30V76H22V45H34Z" fill="#454d66" stroke="#65708a" stroke-width="3"/>
   <path d="M42 53H49V66H42ZM63 53H70V66H63Z" fill="#f0f3ff"/>
   <path d="M39 85H49V94H39ZM63 85H73V94H63Z" fill="#434b68"/>
   <path class="twinkle" d="M88 5C92 20 97 25 112 29C97 33 92 38 88 53C84 38 79 33 64 29C79 25 84 20 88 5Z" fill="#a6bbff"/>
   <path class="twinkle twinkle2" d="M112 50C115 57 118 60 126 63C118 65 115 69 112 77C109 69 106 66 98 63C106 60 109 57 112 50Z" fill="#c1a3fa"/>
   <path class="twinkle twinkle3" d="M21 0C24 9 27 12 36 15C27 18 24 21 21 30C18 21 15 18 6 15C15 12 18 9 21 0Z" fill="#95bdff"/>
 </g>
</g>

<!-- 6. CURSOR: works on a tiny editor attached to T's side. -->
<g id="cursor-panel" transform="translate(1262 225)">
  <rect x="0" y="0" width="116" height="92" rx="6" fill="#222831" stroke="#404955" stroke-width="3"/>
  <path d="M2 20H114" stroke="#414a58" stroke-width="2"/>
  <circle cx="13" cy="11" r="3" fill="#b7bbc5"/><circle cx="24" cy="11" r="3" fill="#767e8d"/><circle cx="35" cy="11" r="3" fill="#767e8d"/>
  <rect x="15" y="35" width="29" height="4" rx="1.5" fill="#899aab"/>
  <rect x="15" y="48" width="52" height="4" rx="1.5" fill="#677689"/>
  <rect class="code-line1" x="15" y="61" width="38" height="4" rx="1.5" fill="#de896e"/>
  <rect class="code-line2" x="15" y="74" width="58" height="4" rx="1.5" fill="#98c7bd"/>
  <path d="M83 37L91 45L83 53" stroke="#dedfe4" stroke-width="3" fill="none" stroke-linecap="square"/>
  <path class="terminal-caret" d="M95 54H105" stroke="#dedfe4" stroke-width="3"/>
</g>
<g id="cursor" transform="translate(1178 290)">
  <g class="cursor-bob">
   <path d="M16 15H26V7H57V15H68V25H77V66H69V76H57V85H24V76H13V66H5V25H16Z" fill="#e8e9ec"/>
   <path d="M21 27H62V58H21Z" fill="#252a31"/>
   <path d="M30 36H37V48H30ZM49 36H56V48H49Z" fill="#f9fbff"/>
   <path d="M24 79H35V94H23ZM53 79H64V94H52Z" fill="#d3d7df"/>
   <g class="cursor-arm"><path d="M64 43H77V35H91V29H98V41H88V50H79V56H65Z" fill="#e3e5e9"/></g>
   <g class="pointer"><path d="M101 -1V26L108 20L114 34L121 30L114 16L125 14Z" fill="#f6f7f9" stroke="#313945" stroke-width="2"/></g>
   <g class="click-pulse" stroke="#dc8b6f" stroke-width="3" stroke-linecap="round"><path d="M119 -9L124 -15M129 2L137 0M126 14L132 20"/></g>
  </g>
</g>

<!-- Three small sparks implying interaction, rather than an extra label. -->
<rect x="185" y="310" width="5" height="5" fill="#d46f55" opacity=".75"/>
<rect x="1115" y="322" width="5" height="5" fill="#8c9ece" opacity=".65"/>
<rect x="1211" y="117" width="4" height="4" fill="#acb2c9" opacity=".5"/>
</g>
</svg>
